name: ci

on:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    check:
        name: check
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Check out the pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Lint workflows
              uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

            - name: Scan the full history for secrets
              run: |
                  docker run --rm -v "$PWD:/repo:ro" \
                      zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
                      git --redact --exit-code 1 /repo

            - name: Lint shell scripts
              run: shellcheck scripts/*.sh scripts/test/*.sh

            - name: Format and validate the Caddyfile, then enforce the edge policy
              run: scripts/check.sh

            - name: Test the host deploy script
              run: scripts/test/deploy-proxy.test.sh

            - name: Summarise hostname changes
              if: always()
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: scripts/hostname-summary.sh >>"$GITHUB_STEP_SUMMARY"
