services:
    caddy:
        image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
        container_name: proxy-caddy
        restart: unless-stopped
        network_mode: host
        env_file: ./proxy.env
        command: caddy run --config /etc/caddy/current/Caddyfile --adapter caddyfile
        healthcheck:
            test:
                [
                    'CMD',
                    'wget', '-q', '-O', '/dev/null', '-T', '3',
                    'http://127.0.0.1:2019/config/',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        volumes:
            - ./config:/etc/caddy:ro
            - /var/log/caddy:/var/log/caddy
            - ./sites:/srv:ro
            - caddy_data:/data
            - caddy_config:/config

volumes:
    caddy_data:
    caddy_config:
